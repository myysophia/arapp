name: ArApp
options:
  bundleIdPrefix: com.myysophia
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: $(TARGET_NAME)
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ALWAYS_SEARCH_USER_PATHS: NO
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ONLY_ACTIVE_ARCH: YES
    Release:
      ENABLE_TESTABILITY: NO
      SWIFT_OPTIMIZATION_LEVEL: -O
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
targets:
  ArApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: SharedUI
      - path: Models
        excludes:
          - README.md
      - path: Services
        excludes:
          - README.md
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myysophia.arapp
        INFOPLIST_FILE: App/Info.plist
        ARAPP_SUPABASE_REDIRECT_SCHEME: arapp
        ARAPP_SUPABASE_REDIRECT_HOST: auth
        ARAPP_SUPABASE_REDIRECT_PATH: /callback
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: YES
    dependencies:
      - package: Supabase
        product: Auth
    scheme:
      testTargets:
        - ArAppTests
        - ArAppUITests
  ArAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
        excludes:
          - .gitkeep
    dependencies:
      - target: ArApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myysophia.arapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ArApp
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ArApp.app/ArApp
        BUNDLE_LOADER: $(TEST_HOST)
  ArAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
        excludes:
          - .gitkeep
    dependencies:
      - target: ArApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myysophia.arapp.uitests
        GENERATE_INFOPLIST_FILE: YES
